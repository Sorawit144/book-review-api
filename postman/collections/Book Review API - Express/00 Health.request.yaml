$kind: http-request
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      pm.test('Database is reachable', function () { pm.expect(pm.response.json().status).to.eql('ok'); });
    language: text/javascript
order: 1000
