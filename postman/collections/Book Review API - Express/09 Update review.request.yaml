$kind: http-request
url: "{{baseUrl}}/books/{{bookId}}/reviews/{{reviewId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "rating": 4,
      "content": "ปรับคะแนนหลังอ่านจบ"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      pm.test('Rating is updated', function () { pm.expect(pm.response.json().rating).to.eql(4); });
    language: text/javascript
order: 10000
