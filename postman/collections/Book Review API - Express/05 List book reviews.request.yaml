$kind: http-request
url: "{{baseUrl}}/books/{{bookId}}/reviews"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      pm.test('Review list', function () { pm.expect(pm.response.json()).to.have.lengthOf(1); });
    language: text/javascript
order: 6000
